<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Sử dụng thẻ hình ảnh</title>
</head>
<body>
    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      Thẻ img dùng để chèn ảnh.
      - src: Đường dẫn tới ảnh (có thể dùng link ảnh trên mạng hoặc ảnh trong cùng thư mục)
      - alt: Chữ mô tả hình ảnh (hiển thị khi ảnh bị lỗi hoặc cho người khiếm thị)
      - width/height: Chỉnh kích thước ảnh cho gọn gàng (không bắt buộc)
    -->
    <img src="https://picsum.photos/600/400" alt="Hình ảnh thiên nhiên đẹp mắt" width="600">
</body>
</html>
